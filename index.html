<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Sói Online</title>

    <!-- Thư viện Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b 0%, #090d16 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            transition: background 0.6s ease;
        }

        body.day-mode {
            background: linear-gradient(180deg, #1e3a8a 0%, #2563eb 45%, #0f172a 100%);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .main-game-area {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }
        
        .layout-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        @media (min-width: 900px) {
            .layout-wrapper {
                flex-direction: row;
                align-items: flex-start;
            }
            .main-game-area {
                width: 70%;
            }
            .sidebar {
                width: 30%;
                min-width: 300px;
            }
        }

        .lobby-card {
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid #475569;
            border-radius: 16px;
            padding: 25px;
            max-width: 500px;
            margin: 30px auto;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .lobby-card h1 {
            margin-top: 0;
            color: #facc15;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #38bdf8;
        }

        .divider {
            margin: 18px 0;
            border-top: 1px solid #334155;
            position: relative;
        }

        .divider span {
            position: absolute;
            top: -11px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            padding: 0 10px;
            color: #94a3b8;
            font-size: 13px;
        }

        .btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .btn:hover {
            filter: brightness(1.15);
        }

        .btn-primary {
            background: #3b82f6;
        }

        .btn-success {
            background: #10b981;
        }

        .btn-warn {
            background: #f59e0b;
            color: #000;
        }

        .btn-full {
            width: 100%;
        }

        .kick-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .kick-btn:hover {
            background: #dc2626;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            flex-wrap: wrap;
            gap: 10px;
        }

        .room-tag {
            background: #facc15;
            color: #000;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .phase-badge {
            font-size: 16px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            background: #312e81;
            color: #c7d2fe;
        }

        .day-mode .phase-badge {
            background: #fef08a;
            color: #854d0e;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #475569;
        }

        .sound-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
        }

        input[type="range"].volume-slider {
            width: 90px;
            accent-color: #facc15;
            cursor: pointer;
            height: 5px;
        }

        .volume-percent {
            font-size: 12px;
            color: #cbd5e1;
            min-width: 34px;
            text-align: right;
            font-weight: bold;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .player-card {
            background: rgba(30, 41, 59, 0.92);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }
        
        .player-card.empty-seat {
            background: rgba(15, 23, 42, 0.5);
            border-style: dashed;
            cursor: default;
            color: #64748b;
        }

        .player-card:hover:not(.dead):not(.empty-seat) {
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .player-card.selected {
            border-color: #facc15;
            background: rgba(250, 204, 21, 0.2);
            box-shadow: 0 0 10px #facc15;
        }

        .player-card.dead {
            opacity: 0.45;
            background: #0f172a;
            border-color: #7f1d1d;
            cursor: not-allowed;
        }

        .player-card.is-me {
            border-color: #38bdf8;
        }

        .avatar {
            font-size: 28px;
            margin-bottom: 4px;
        }

        .p-name {
            font-weight: bold;
            font-size: 14px;
            word-break: break-word;
        }

        .p-status {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .vote-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ef4444;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 12px;
        }

        .action-panel {
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid #475569;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        
        #host-controls { 
            background: #334155; 
            padding: 10px; 
            border: 1px solid #475569; 
            border-radius: 8px; 
            margin-bottom: 10px;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        #host-controls select {
            width: auto;
            display: inline-block;
            padding: 6px 12px;
        }

        #phase-timer-box {
            font-size: 18px;
            font-weight: bold;
            color: #f87171;
            margin-bottom: 8px;
            display: none;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        #action-prompt {
            font-size: 15px;
            font-weight: bold;
            color: #fde047;
            margin-bottom: 10px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        .chat-box {
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid #334155;
            border-radius: 12px;
            height: 400px;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            font-size: 13px;
            flex: 1;
        }

        .log-item {
            padding: 7px 11px;
            border-radius: 8px;
            background: #1e293b;
            line-height: 1.4;
        }

        .log-system {
            background: #312e81;
            color: #e0e7ff;
            font-weight: bold;
            border-left: 4px solid #818cf8;
        }

        .log-death {
            background: #450a0a;
            color: #fecaca;
            font-weight: bold;
            border-left: 4px solid #ef4444;
        }

        .log-seer {
            background: #064e3b;
            color: #a7f3d0;
            border-left: 4px solid #10b981;
        }

        .log-wolf {
            background: #7f1d1d;
            color: #fca5a5;
            border-left: 4px solid #f87171;
        }

        .log-cupid {
            background: #831843;
            color: #fbcfe8;
            border-left: 4px solid #f472b6;
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
        }
    </style>
</head>

<body>

    <audio id="bgm-audio" src="Ma Sói - Nhạc Nền.mp3" loop preload="auto"></audio>
    <div id="lobby-screen" class="lobby-card">
        <h1>🐺 MA SÓI ONLINE</h1>
        <div class="form-group">
            <label>Tên hiển thị của bạn:</label>
            <input type="text" id="player-name-input" placeholder="Nhập tên của bạn (VD: Minh Anh)..." maxlength="16">
        </div>

        <div class="form-group">
            <label>Số người chơi tối đa (Chủ phòng chọn):</label>
            <select id="max-players-select">
                <option value="5">5 Người (1 Sói, 1 Tiên tri, 1 Bảo Vệ, 2 Dân)</option>
                <option value="8" selected>8 Người (2 Sói, 1 Tiên tri, 1 Bảo Vệ, 1 Thợ Săn, 1 Cupid, 2 Dân)</option>
                <option value="11">11 Người (3 Sói, 1 Tiên tri, 1 Bảo Vệ, 1 Thợ Săn, 1 Cupid, 4 Dân)</option>
                <option value="13">13 Người (3 Sói, 1 Tiên tri, 1 Bảo Vệ, 1 Thợ Săn, 1 Cupid, 6 Dân)</option>
                <option value="15">15 Người (4 Sói, 1 Tiên tri, 1 Bảo Vệ, 1 Thợ Săn, 1 Cupid, 7 Dân)</option>
                <option value="19">19 Người (5 Sói, 1 Tiên tri, 1 Bảo Vệ, 1 Thợ Săn, 1 Cupid, 10 Dân)</option>
            </select>
        </div>
        <button class="btn btn-success btn-full" onclick="createRoom()">👑 Tạo Phòng Mới</button>

        <div class="divider"><span>HOẶC VÀO PHÒNG BẠN BÈ</span></div>
        <div class="form-group">
            <label>Nhập Mã Phòng (4 chữ số):</label>
            <input type="number" id="room-code-input" placeholder="Ví dụ: 4829">
        </div>
        <button class="btn btn-primary btn-full" onclick="joinRoom()">🚪 Tham Gia Phòng</button>
        <div id="lobby-status" style="margin-top:12px; color:#facc15; font-size:14px;"></div>
    </div>

    <div id="game-screen" class="container" style="display:none;">
        <div class="top-bar">
            <div class="room-tag" onclick="copyRoomCode()" title="Bấm để sao chép mã phòng">🔑 Mã phòng: <span
                    id="display-room-code">----</span></div>
            <div class="phase-badge" id="phase-display">⏳ SẢNH CHỜ</div>
            <div id="my-role-display" style="font-weight:bold; color:#38bdf8; font-size:14px;">Vai trò: Chưa bắt đầu
            </div>

            <div class="volume-box" title="Điều chỉnh âm lượng nhạc nền & hiệu ứng">
                <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
                <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="60"
                    oninput="setVolume(this.value)">
                <span class="volume-percent" id="volume-percent">60%</span>
            </div>
        </div>
        
        <div id="host-controls">
            <strong>👑 Quyền Chủ Phòng:</strong>
            <label>Chỉnh số người:</label>
            <select id="lobby-max-players-select">
                <option value="5">5 Người</option>
                <option value="8">8 Người</option>
                <option value="11">11 Người</option>
                <option value="13">13 Người</option>
                <option value="15">15 Người</option>
                <option value="19">19 Người</option>
            </select>
            <button class="btn btn-success" style="padding: 6px 12px; font-size: 14px;" onclick="changeMaxPlayers()">Cập nhật</button>
        </div>

        <div class="layout-wrapper">
            <div class="main-game-area">
                <div class="players-grid" id="players-grid"></div>

                <div class="action-panel">
                    <div id="phase-timer-box">⏳ <span id="timer-label">Thời gian còn lại</span>: <span id="phase-timer">45</span>s</div>
                    <div id="action-prompt">Đang chờ chủ phòng bắt đầu...</div>
                    <div class="action-buttons" id="action-buttons"></div>
                </div>
            </div>

            <div class="sidebar">
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="Nhập tin nhắn..."
                        onkeydown="if(event.key==='Enter') sendChat()">
                    <button class="btn btn-primary" onclick="sendChat()">Gửi</button>
                </div>
                <div class="chat-box" id="chat-box"></div>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // 1. CẤU HÌNH FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBR0i0evDpOR3ASrfl1b4Hcvb-_ssd8_6Y",
            authDomain: "memaybeo01.firebaseapp.com",
            databaseURL: "https://memaybeo01-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "memaybeo01",
            storageBucket: "memaybeo01.firebasestorage.app",
            messagingSenderId: "811199279426",
            appId: "1:811199279426:web:3f1d18003be246c09a18db",
            measurementId: "G-416SFVTG4V"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ================= HỆ THỐNG ÂM THANH =================
        let masterVolume = 0.6;
        let isMuted = false;
        let lastVolumeBeforeMute = 60;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const bgm = document.getElementById('bgm-audio');
            bgm.volume = isMuted ? 0 : masterVolume;
            bgm.play().catch(() => { });
        }

        function setVolume(val) {
            const num = parseInt(val, 10);
            masterVolume = num / 100;
            isMuted = (num === 0);
            if (num > 0) lastVolumeBeforeMute = num;
            document.getElementById('volume-percent').innerText = num + '%';
            document.getElementById('mute-btn').innerText = num === 0 ? '🔇' : (num < 40 ? '🔉' : '🔊');
            const bgm = document.getElementById('bgm-audio');
            bgm.volume = masterVolume;
            if (!isMuted && bgm.paused) bgm.play().catch(() => { });
        }

        function toggleMute() {
            const slider = document.getElementById('volume-slider');
            if (isMuted || masterVolume === 0) {
                const restore = lastVolumeBeforeMute > 0 ? lastVolumeBeforeMute : 60;
                slider.value = restore; setVolume(restore);
            } else {
                lastVolumeBeforeMute = parseInt(slider.value, 10);
                slider.value = 0; setVolume(0);
            }
        }

        function playSFX(type) {
            if (isMuted || masterVolume <= 0) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                const vol = masterVolume * 0.35;

                if (type === 'NIGHT') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(340, now + 0.4); osc.frequency.exponentialRampToValueAtTime(160, now + 1.1);
                    gain.gain.setValueAtTime(0.01, now); gain.gain.linearRampToValueAtTime(vol, now + 0.3); gain.gain.exponentialRampToValueAtTime(0.001, now + 1.15);
                    osc.start(now); osc.stop(now + 1.2);
                } else if (type === 'DAY') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.15); osc.frequency.setValueAtTime(783.99, now + 0.3);
                    gain.gain.setValueAtTime(vol, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
                    osc.start(now); osc.stop(now + 0.75);
                } else if (type === 'DEATH') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(45, now + 0.6);
                    gain.gain.setValueAtTime(vol * 1.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
                    osc.start(now); osc.stop(now + 0.7);
                } else if (type === 'CHAT') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
                    gain.gain.setValueAtTime(vol * 0.4, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now); osc.stop(now + 0.12);
                }
            } catch (e) { }
        }

        // ================= LOGIC GAME =================
        const AVATARS = ["😎", "👩", "👨", "👧", "🧑", "👱‍♀️", "🧔", "👩‍🦱", "🦊", "🐼", "🐸", "🐯"];
        const AI_NAMES = ["Bot Lan", "Bot Hùng", "Bot Trang", "Bot Dũng", "Bot Mai", "Bot Sơn", "Bot Vy", "Bot Khoa", "Bot Linh", "Bot Nam"];

        let isHost = false, roomCode = "", myId = "", myName = "", lastRenderedPhase = "";
        let hasJoinedLobby = false;
        let phaseInterval = null;
        let isResolvingPhase = false; 
        let renderedChatKeys = new Set(); 
        let selectedTargets = [];
        let state = { maxPlayers: 8, phase: 'LOBBY', dayCount: 1, players: [], lastGuardedId: null, hunterId: null, lovers: [], phaseTimer: 45 };

        function getPlayerName() {
            const val = document.getElementById('player-name-input').value.trim();
            if (!val) { alert("Vui lòng nhập tên của bạn trước!"); return null; }
            return val;
        }

        function createRoom() {
            myName = getPlayerName();
            if (!myName) return;
            initAudio();

            isHost = true;
            hasJoinedLobby = true;
            roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            state.maxPlayers = parseInt(document.getElementById('max-players-select').value);
            myId = "HOST_" + Math.random().toString(36).substr(2, 6);

            document.getElementById('lobby-status').innerText = "Đang tạo phòng trên Firebase...";
            state.players = [{ id: myId, name: myName, avatar: AVATARS[0], isAI: false, role: null, alive: true, votes: 0 }];

            const roomRef = db.ref('rooms/' + roomCode);
            roomRef.set({ state: state }).then(() => {
                enterGameScreen();
                broadcastLog(`👑 Bạn đã tạo phòng <b>${roomCode}</b> (${state.maxPlayers} người). Hãy gửi mã cho bạn bè!`, 'system');
                setupHostListeners();
                
                // Cập nhật onDisconnect để tự chết khi thoát
                roomRef.child('players').on('value', snap => {
                    if(snap.exists()) {
                        let players = snap.val();
                        let myIndex = players.findIndex(p => p.id === myId);
                        if (myIndex !== -1) {
                            roomRef.child('players/' + myIndex + '/alive').onDisconnect().set(false);
                            // Thông báo tự động chết khi mất kết nối
                            const disconnectMsg = `🔌 <b>${myName}</b> đã ngắt kết nối và tự vẫn!`;
                            roomRef.child('disconnectLogs').onDisconnect().set({
                                msg: disconnectMsg,
                                time: firebase.database.ServerValue.TIMESTAMP
                            });
                        }
                    }
                });
                
            });
        }

        function joinRoom() {
            myName = getPlayerName();
            if (!myName) return;
            initAudio();

            const code = document.getElementById('room-code-input').value.trim();
            if (code.length !== 4) { alert("Vui lòng nhập đúng mã phòng 4 chữ số!"); return; }

            isHost = false; roomCode = code; hasJoinedLobby = false;
            myId = "PLAYER_" + Math.random().toString(36).substr(2, 6);
            document.getElementById('lobby-status').innerText = "Đang kết nối vào phòng " + code + "...";

            db.ref('rooms/' + roomCode + '/state').once('value').then(snap => {
                if (!snap.exists()) { alert("❌ Không tìm thấy phòng " + code + "!"); return; }
                const curState = snap.val();
                if (curState.phase !== 'LOBBY') { alert("Phòng đã bắt đầu chơi!"); return; }
                if (curState.players && curState.players.length >= curState.maxPlayers) { alert("Phòng đã đầy!"); return; }

                db.ref('rooms/' + roomCode + '/joinRequests').push({ id: myId, name: myName });
                enterGameScreen();
                
                // Thiết lập ngắt kết nối cho người tham gia
                const roomRef = db.ref('rooms/' + roomCode);
                roomRef.child('state/players').on('value', playersSnap => {
                    if(playersSnap.exists()) {
                        let players = playersSnap.val();
                        let myIndex = players.findIndex(p => p.id === myId);
                        if (myIndex !== -1) {
                            roomRef.child('state/players/' + myIndex + '/alive').onDisconnect().set(false);
                            const disconnectMsg = `🔌 <b>${myName}</b> đã ngắt kết nối và tự vẫn!`;
                            roomRef.child('disconnectLogs').onDisconnect().set({
                                msg: disconnectMsg,
                                time: firebase.database.ServerValue.TIMESTAMP
                            });
                        }
                    }
                });
            });
        }

        function enterGameScreen() {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('display-room-code').innerText = roomCode;
            setupClientListeners();
        }

        function copyRoomCode() { navigator.clipboard.writeText(roomCode); alert("Đã copy mã phòng: " + roomCode); }

        function broadcastState() { if (isHost) db.ref('rooms/' + roomCode + '/state').set(state); }
        function broadcastLog(text, logType = '') { db.ref('rooms/' + roomCode + '/chat').push({ text, logType }); }
        function sendLogToPlayer(playerId, text, logType = '') {
            if (isHost) db.ref('rooms/' + roomCode + '/privateChat/' + playerId).push({ text, logType });
        }

        function changeMaxPlayers() {
            if (!isHost) return;
            const newMax = parseInt(document.getElementById('lobby-max-players-select').value);
            const currentPlayersCount = state.players ? state.players.length : 0;
            
            if (currentPlayersCount > newMax) {
                alert(`Không thể giảm! Phòng đang có ${currentPlayersCount} người. Cần kích bớt người chơi trước khi giảm xuống ${newMax}.`);
                document.getElementById('lobby-max-players-select').value = state.maxPlayers;
                return;
            }
            
            state.maxPlayers = newMax;
            broadcastLog(`⚙️ Chủ phòng đã thay đổi giới hạn phòng thành ${newMax} người.`, 'system');
            broadcastState();
        }

        // ================= TÍNH NĂNG KÍCH THÀNH VIÊN =================
        function kickPlayer(event, targetId) {
            event.stopPropagation();
            if (!isHost || state.phase !== 'LOBBY') return;
            const target = state.players.find(p => p.id === targetId);
            if (!target) return;

            if (confirm(`Bạn có chắc muốn mời "${target.name}" ra khỏi phòng?`)) {
                state.players = state.players.filter(p => p.id !== targetId);
                broadcastLog(`👢 Chủ phòng đã mời <b>${target.name}</b> ra khỏi phòng.`, 'system');
                broadcastState();
            }
        }

        function setupHostListeners() {
            db.ref('rooms/' + roomCode + '/joinRequests').on('child_added', snap => {
                const req = snap.val();
                if (state.players.length < state.maxPlayers && state.phase === 'LOBBY') {
                    state.players.push({ id: req.id, name: req.name, avatar: AVATARS[state.players.length % AVATARS.length], isAI: false, alive: true, votes: 0 });
                    broadcastLog(`👋 <b>${req.name}</b> đã tham gia phòng!`, 'system');
                    broadcastState();
                }
                snap.ref.remove();
            });
            db.ref('rooms/' + roomCode + '/actions').on('child_added', snap => {
                const data = snap.val(); processNightAction(data.playerId, data.targetData); snap.ref.remove();
            });
            db.ref('rooms/' + roomCode + '/votes').on('child_added', snap => {
                const data = snap.val(); processVote(data.playerId, data.targetId); snap.ref.remove();
            });
            db.ref('rooms/' + roomCode + '/hunterShots').on('child_added', snap => {
                const data = snap.val(); processHunterShot(data.playerId, data.targetId); snap.ref.remove();
            });
            
            // Xử lý khi có ai đó ngắt kết nối
            db.ref('rooms/' + roomCode + '/disconnectLogs').on('value', snap => {
                if(snap.exists()) {
                    let data = snap.val();
                    broadcastLog(data.msg, 'death');
                    
                    // Xóa log để lần sau còn trigger
                    db.ref('rooms/' + roomCode + '/disconnectLogs').remove();
                    
                    // Kiểm tra win condition nếu có người chết
                    if(state.phase !== 'LOBBY' && state.phase !== 'GAMEOVER') {
                         setTimeout(() => {
                            if (checkWinCondition()) {
                                // Game kết thúc thì các logic khác sẽ được clear
                            }
                         }, 1000);
                    }
                }
            });
        }

        function setupClientListeners() {
            db.ref('rooms/' + roomCode + '/state').on('value', snap => {
                if (snap.exists()) {
                    state = snap.val();
                    if (!state.players) state.players = [];
                    if (!state.lovers) state.lovers = [];

                    const amIInList = state.players.some(p => p.id === myId);
                    if (amIInList) {
                        hasJoinedLobby = true;
                    } else if (hasJoinedLobby && !isHost) {
                        alert("🚫 Bạn đã bị chủ phòng mời ra khỏi phòng!");
                        location.reload();
                        return;
                    }

                    renderAll();
                } else if (!isHost) {
                    alert("Chủ phòng đã giải tán trò chơi!");
                    location.reload();
                }
            });
            db.ref('rooms/' + roomCode + '/chat').on('child_added', snap => {
                if (renderedChatKeys.has(snap.key)) return;
                renderedChatKeys.add(snap.key);
                const data = snap.val();
                addLogUI(data.text, data.logType);
            });
            db.ref('rooms/' + roomCode + '/chat').on('child_removed', () => {
                if (document.getElementById('chat-box').children.length > 0 && state.dayCount === 1 && state.phase === 'NIGHT') {
                    renderedChatKeys.clear();
                    document.getElementById('chat-box').innerHTML = '';
                }
            });
            db.ref('rooms/' + roomCode + '/privateChat/' + myId).on('child_added', snap => {
                if (renderedChatKeys.has(snap.key)) return;
                renderedChatKeys.add(snap.key);
                const data = snap.val();
                addLogUI(data.text, data.logType);
                snap.ref.remove();
            });
        }

        function addLogUI(text, logType = '') {
            const box = document.getElementById('chat-box');
            const newItem = document.createElement('div');
            newItem.className = `log-item ${logType ? 'log-' + logType : ''}`;
            newItem.innerHTML = text;
            box.insertBefore(newItem, box.firstChild);
            
            if (logType === 'death') playSFX('DEATH'); else if (!logType) playSFX('CHAT');
        }

        function addAIPlayers() {
            if (!isHost) return;
            while (state.players.length < state.maxPlayers) {
                const idx = state.players.length;
                state.players.push({
                    id: "AI_" + idx + "_" + Math.random().toString(36).substr(2, 4),
                    name: AI_NAMES[(idx - 1) % AI_NAMES.length] + " (AI)",
                    avatar: AVATARS[idx % AVATARS.length], isAI: true, role: null, alive: true, votes: 0
                });
            }
            broadcastLog(`🤖 Đã tự động điền máy AI cho đủ người.`, 'system'); broadcastState();
        }

        function returnToLobby() {
            if (!isHost) return;
            clearInterval(phaseInterval);
            isResolvingPhase = false;
            
            renderedChatKeys.clear();
            document.getElementById('chat-box').innerHTML = '';
            db.ref('rooms/' + roomCode + '/chat').remove();

            state.phase = 'LOBBY';
            state.dayCount = 1;
            state.lastGuardedId = null;
            state.hunterId = null;
            state.lovers = [];
            
            state.players.forEach(p => {
                p.role = null;
                p.alive = true;
                p.votes = 0;
                p.nightTarget = null;
                p.nightActionDone = false;
                p.voted = false;
            });
            
            broadcastLog(`🏠 Chủ phòng đã đưa mọi người trở về Sảnh Chờ!`, 'system');
            broadcastState();
        }

        function generateRoles(count) {
            const roles = [];
            let wolfCount = 1;
            if (count >= 19) wolfCount = 5;
            else if (count >= 15) wolfCount = 4;
            else if (count >= 10) wolfCount = 3;
            else if (count >= 6) wolfCount = 2;

            for (let i = 0; i < wolfCount; i++) roles.push({ id: 'WOLF', name: 'Ma Sói 🐺', desc: 'Ban đêm cùng chọn 1 người để cắn.' });
            roles.push({ id: 'SEER', name: 'Tiên Tri 🔮', desc: 'Ban đêm soi 1 người.' });
            roles.push({ id: 'GUARD', name: 'Bảo Vệ 🛡️', desc: 'Ban đêm bảo vệ 1 người.' });

            if (count >= 7) roles.push({ id: 'HUNTER', name: 'Thợ Săn 🏹', desc: 'Khi chết được bắn kéo theo 1 người.' });
            if (count >= 8) roles.push({ id: 'CUPID', name: 'Thần Cupid 👼', desc: 'Đêm đầu tiên ghép đôi 2 người sống chết có nhau.' });

            while (roles.length < count) roles.push({ id: 'VILLAGER', name: 'Dân Làng 🧑‍🌾', desc: 'Tìm và treo cổ Ma Sói.' });
            return roles.sort(() => Math.random() - 0.5);
        }

        function startGame() {
            if (!isHost) return;
            if (state.players.length < 5) { alert("Cần ít nhất 5 người!"); return; }

            clearInterval(phaseInterval);
            isResolvingPhase = false;

            const roles = generateRoles(state.players.length);
            state.dayCount = 1; state.lastGuardedId = null; state.lovers = [];
            state.players.forEach((p, idx) => { p.role = roles[idx]; p.alive = true; p.votes = 0; });

            broadcastLog(`🎲 <b>VÁN CHƠI BẮT ĐẦU!</b> Đã chia vai trò bí mật.`, 'system');
            const wolves = state.players.filter(p => p.role.id === 'WOLF');

            state.players.forEach(p => {
                if (!p.isAI) {
                    sendLogToPlayer(p.id, `🎭 Vai trò của bạn: <b>${p.role.name}</b> — ${p.role.desc}`, 'system');
                    if (p.role.id === 'WOLF' && wolves.length > 1) {
                        sendLogToPlayer(p.id, `🐺 Đồng bọn Sói của bạn là: <b>${wolves.filter(w => w.id !== p.id).map(w => w.name).join(', ')}</b>`, 'wolf');
                    }
                }
            });
            startNightPhase();
        }

        // ================= PHA BAN ĐÊM (30 GIÂY CHỨC NĂNG) =================
        function startNightPhase() {
            if (!isHost) return;
            clearInterval(phaseInterval);
            isResolvingPhase = false;

            state.phase = 'NIGHT';
            state.phaseTimer = 45;
            selectedTargets = [];

            let humanHasSkill = false;
            state.players.forEach(p => {
                p.votes = 0; p.nightTarget = null;
                const hasSkill = p.alive && (['WOLF', 'SEER', 'GUARD'].includes(p.role.id) || (p.role.id === 'CUPID' && state.dayCount === 1));
                p.nightActionDone = (!hasSkill || p.isAI);
                if (!p.nightActionDone) humanHasSkill = true;
            });

            broadcastLog(`🌙 <b>ĐÊM THỨ ${state.dayCount}</b> buông xuống... (45 giây hành động)`, 'system');
            broadcastState();

            if (!humanHasSkill) {
                setTimeout(resolveNight, 1500);
                return;
            }

            phaseInterval = setInterval(() => {
                if (state.phase !== 'NIGHT') {
                    clearInterval(phaseInterval);
                    return;
                }
                state.phaseTimer--;
                broadcastState();

                if (state.phaseTimer <= 0) {
                    clearInterval(phaseInterval);
                    broadcastLog(`⏰ <b>HẾT 45 GIÂY BAN ĐÊM!</b> Trời bắt đầu sáng...`, 'system');
                    resolveNight();
                }
            }, 1000);
        }

        function submitNightAction() {
            const me = state.players.find(p => p.id === myId);
            const isCupid = me.role.id === 'CUPID' && state.dayCount === 1;

            if (isCupid) {
                if (selectedTargets.length !== 2) { alert("Thiên sứ tình yêu cần chọn đúng 2 người!"); return; }
            } else {
                if (selectedTargets.length === 0) { alert("Hãy chọn 1 người chơi!"); return; }
                if (me.role.id === 'SEER' && selectedTargets[0] === myId) { alert("Không thể tự soi chính mình!"); return; }
                if (me.role.id === 'GUARD' && selectedTargets[0] === state.lastGuardedId) { alert("Không bảo vệ 1 người 2 đêm liên tiếp!"); return; }
            }

            const payloadData = isCupid ? selectedTargets : selectedTargets[0];
            if (isHost) processNightAction(myId, payloadData);
            else db.ref('rooms/' + roomCode + '/actions').push({ playerId: myId, targetData: payloadData });
        }

        function processNightAction(playerId, targetData) {
            if (state.phase !== 'NIGHT' || isResolvingPhase) return;
            const p = state.players.find(x => x.id === playerId);
            if (!p || !p.alive || p.nightActionDone) return;
            p.nightActionDone = true;

            if (p.role.id === 'CUPID' && state.dayCount === 1) {
                state.lovers = targetData || [];
                state.lovers.forEach(lId => {
                    const mateId = state.lovers.find(id => id !== lId);
                    const mate = state.players.find(x => x.id === mateId);
                    if (mate) sendLogToPlayer(lId, `💘 Mũi tên tình yêu đã ghép đôi bạn với <b>${mate.name}</b>. Chung 1 sinh mệnh!`, 'cupid');
                });
            } else {
                p.nightTarget = targetData;
                if (p.role.id === 'SEER') {
                    const target = state.players.find(x => x.id === targetData);
                    const isWolf = target.role.id === 'WOLF';
                    sendLogToPlayer(p.id, `🔮 Soi <b>${target.name}</b>: ${isWolf ? '<span style="color:#f87171">MA SÓI 🐺</span>' : '<span style="color:#34d399">PHE DÂN ✨</span>'}!`, 'seer');
                }
            }
            broadcastState();
            checkAllNightActionsDone();
        }

        function checkAllNightActionsDone() {
            if (!isHost || state.phase !== 'NIGHT' || isResolvingPhase) return;
            if (!state.players.some(p => !p.nightActionDone)) {
                clearInterval(phaseInterval);
                setTimeout(resolveNight, 1000);
            }
        }

        function killPlayerAndCheckLover(deadPlayerId, reasonMsg) {
            let deadList = [];
            const primaryDead = state.players.find(p => p.id === deadPlayerId);
            if (primaryDead && primaryDead.alive) {
                primaryDead.alive = false; deadList.push(primaryDead);
                // Đã chỉnh sửa để KHÔNG hiện vai trò khi chết
                broadcastLog(reasonMsg, 'death');

                if (state.lovers && state.lovers.includes(deadPlayerId)) {
                    const loverId = state.lovers.find(id => id !== deadPlayerId);
                    const lover = state.players.find(p => p.id === loverId);
                    if (lover && lover.alive) {
                        lover.alive = false; deadList.push(lover);
                        setTimeout(() => { broadcastLog(`💔 <b>${lover.name}</b> đau đớn tột cùng và tự vẫn theo người tình!`, 'death'); broadcastState(); }, 1000);
                    }
                }
            }
            return deadList;
        }

        function resolveNight() {
            if (!isHost || state.phase !== 'NIGHT' || isResolvingPhase) return;
            isResolvingPhase = true;
            clearInterval(phaseInterval);

            const cupid = state.players.find(p => p.alive && p.role.id === 'CUPID' && p.isAI);
            if (cupid && state.dayCount === 1) {
                const cands = state.players.filter(p => p.alive).sort(() => 0.5 - Math.random());
                state.lovers = [cands[0].id, cands[1].id];
            }

            let guardTarget = null, wolfTarget = null;
            const guard = state.players.find(p => p.alive && p.role.id === 'GUARD');
            if (guard) {
                guardTarget = guard.isAI ? state.players.filter(p => p.alive && p.id !== state.lastGuardedId).sort(() => 0.5 - Math.random())[0]?.id : guard.nightTarget;
                state.lastGuardedId = guardTarget;
            } else state.lastGuardedId = null;

            const aliveWolves = state.players.filter(p => p.alive && p.role.id === 'WOLF');
            if (aliveWolves.length > 0) {
                const hWolf = aliveWolves.find(w => !w.isAI && w.nightTarget);
                if (hWolf) wolfTarget = hWolf.nightTarget;
                else {
                    const victims = state.players.filter(p => p.alive && p.role.id !== 'WOLF');
                    if (victims.length > 0) wolfTarget = victims[Math.floor(Math.random() * victims.length)].id;
                }
            }

            state.phase = 'DAY_DISCUSS';
            selectedTargets = [];
            broadcastLog(`☀️ <b>NGÀY THỨ ${state.dayCount}</b> — Trời đã sáng!`, 'system');

            let hunterNeedsToShoot = null;
            if (wolfTarget && wolfTarget !== guardTarget) {
                const deadPlayer = state.players.find(p => p.id === wolfTarget);
                const deadList = killPlayerAndCheckLover(wolfTarget, `💀 Đêm qua, <b>${deadPlayer.name}</b> đã bị Ma Sói cắn chết!`);
                const deadHunter = deadList.find(p => p.role.id === 'HUNTER');
                if (deadHunter) hunterNeedsToShoot = deadHunter;
            } else broadcastLog(`🛡️ Đêm qua bình yên, không có ai thiệt mạng!`, 'system');

            broadcastState();

            setTimeout(() => {
                if (hunterNeedsToShoot) {
                    triggerHunter(hunterNeedsToShoot);
                } else if (!checkWinCondition()) {
                    simulateAIChat();
                    setTimeout(startVotePhase, 2000);
                }
            }, 1500);
        }

        function simulateAIChat() {
            const ais = state.players.filter(p => p.alive && p.isAI).sort(() => Math.random() - 0.5).slice(0, 2);
            ais.forEach((ai, i) => {
                setTimeout(() => {
                    if (state.phase !== 'DAY_DISCUSS' && state.phase !== 'DAY_VOTE') return;
                    const others = state.players.filter(p => p.alive && p.id !== ai.id);
                    if (others.length === 0) return;
                    const target = others[Math.floor(Math.random() * others.length)];
                    const msgs = [`Tôi nghi <b>${target.name}</b> là Sói.`, `Mọi người chú ý <b>${target.name}</b> nhé.`, `Xin Tiên Tri hãy soi <b>${target.name}</b>.`];
                    broadcastLog(`💬 <b>${ai.name}:</b> ${msgs[Math.floor(Math.random() * msgs.length)]}`);
                }, (i + 1) * 1000);
            });
        }

        // ================= PHA BỎ PHIẾU (15 GIÂY VOTE) =================
        function startVotePhase() {
            if (!isHost || state.phase === 'DAY_VOTE' || state.phase === 'GAMEOVER') return;
            clearInterval(phaseInterval);
            isResolvingPhase = false;

            state.phase = 'DAY_VOTE';
            state.phaseTimer = 30;
            selectedTargets = [];
            state.players.forEach(p => { p.votes = 0; p.voted = (!p.alive || p.isAI); });

            broadcastLog(`🗳️ <b>BẮT ĐẦU BỎ PHIẾU TREO CỔ! (Bạn có 30 giây)</b>`, 'system');
            broadcastState();

            phaseInterval = setInterval(() => {
                if (state.phase !== 'DAY_VOTE') {
                    clearInterval(phaseInterval);
                    return;
                }
                state.phaseTimer--;
                broadcastState();

                if (state.phaseTimer <= 0) {
                    clearInterval(phaseInterval);
                    broadcastLog(`⏰ <b>HẾT 30 GIÂY!</b> Những ai chưa vote tính là bỏ phiếu trắng.`, 'system');
                    state.players.forEach(p => {
                        if (p.alive && !p.isAI && !p.voted) p.voted = true;
                    });
                    finalizeAIVotesAndResolve();
                }
            }, 1000);
        }

        function submitVote(skip = false) {
            if (!skip && selectedTargets.length === 0) { alert("Hãy chọn 1 người!"); return; }
            if (isHost) processVote(myId, skip ? 'SKIP' : selectedTargets[0]);
            else db.ref('rooms/' + roomCode + '/votes').push({ playerId: myId, targetId: skip ? 'SKIP' : selectedTargets[0] });
        }

        function processVote(playerId, targetId) {
            if (state.phase !== 'DAY_VOTE' || isResolvingPhase) return;
            const voter = state.players.find(p => p.id === playerId);
            if (!voter || !voter.alive || voter.voted) return;

            voter.voted = true;
            if (targetId !== 'SKIP') {
                const target = state.players.find(p => p.id === targetId);
                if (target && target.alive) { target.votes++; broadcastLog(`🗳️ <b>${voter.name}</b> vote treo cổ <b>${target.name}</b>.`); }
            } else broadcastLog(`🗳️ <b>${voter.name}</b> bỏ phiếu trắng.`);

            broadcastState();

            if (!state.players.some(p => !p.voted)) {
                clearInterval(phaseInterval);
                finalizeAIVotesAndResolve();
            }
        }

        function finalizeAIVotesAndResolve() {
            if (!isHost || state.phase !== 'DAY_VOTE' || isResolvingPhase) return;
            isResolvingPhase = true;
            clearInterval(phaseInterval);

            state.players.forEach(ai => {
                if (ai.alive && ai.isAI) {
                    const cands = state.players.filter(p => p.alive && p.id !== ai.id);
                    if (cands.length > 0) {
                        const pick = cands[Math.floor(Math.random() * cands.length)];
                        pick.votes++; broadcastLog(`🗳️ <b>${ai.name}</b> vote treo cổ <b>${pick.name}</b>.`);
                    }
                }
            });
            broadcastState();
            setTimeout(resolveVotes, 1500);
        }

        function resolveVotes() {
            if (!isHost || state.phase !== 'DAY_VOTE') return;
            state.phase = 'RESOLVING_VOTE';

            const alive = state.players.filter(p => p.alive).sort((a, b) => b.votes - a.votes);
            let hunterNeedsToShoot = null;

            if (alive[0] && alive[0].votes > 0 && alive[0].votes > (alive[1]?.votes || 0)) {
                const executed = alive[0];
                // Đã chỉnh sửa để KHÔNG hiện vai trò thật khi bị treo cổ
                const deadList = killPlayerAndCheckLover(executed.id, `⚖️ Dân làng treo cổ <b>${executed.name}</b> (${executed.votes} phiếu)! Danh tính của họ bị giấu kín.`);
                const deadHunter = deadList.find(p => p.role.id === 'HUNTER');
                if (deadHunter) hunterNeedsToShoot = deadHunter;
            } else broadcastLog(`⚖️ Phiếu hòa nhau hoặc không ai vote! Không ai bị treo cổ hôm nay.`, 'system');

            broadcastState();

            setTimeout(() => {
                if (hunterNeedsToShoot) triggerHunter(hunterNeedsToShoot);
                else if (!checkWinCondition()) { state.dayCount++; startNightPhase(); }
            }, 2000);
        }

        function triggerHunter(hunter) {
            if (hunter.isAI) {
                const targets = state.players.filter(p => p.alive && p.id !== hunter.id);
                if (targets.length > 0) {
                    const shot = targets[Math.floor(Math.random() * targets.length)];
                    // Đã chỉnh sửa để KHÔNG hiện vai trò của người bị bắn
                    killPlayerAndCheckLover(shot.id, `🏹 Thợ Săn <b>${hunter.name}</b> hấp hối đã bắn hạ <b>${shot.name}</b>!`);
                }
                setTimeout(() => {
                    if (!checkWinCondition()) {
                        if (state.phase === 'RESOLVING_VOTE' || state.phase === 'DAY_VOTE') { state.dayCount++; startNightPhase(); }
                        else { simulateAIChat(); setTimeout(startVotePhase, 2000); }
                    }
                }, 2000);
            } else {
                state.prevPhase = state.phase; state.phase = 'HUNTER_SHOT'; state.hunterId = hunter.id; selectedTargets = [];
                broadcastLog(`🏹 Thợ Săn <b>${hunter.name}</b> đang chọn mục tiêu để kéo theo...`, 'death'); broadcastState();
            }
        }

        function submitHunterShot() {
            if (selectedTargets.length === 0) { alert("Chọn 1 người để bắn!"); return; }
            if (isHost) processHunterShot(myId, selectedTargets[0]);
            else db.ref('rooms/' + roomCode + '/hunterShots').push({ playerId: myId, targetId: selectedTargets[0] });
        }

        function processHunterShot(playerId, targetId) {
            if (playerId !== state.hunterId || state.phase !== 'HUNTER_SHOT') return;
            state.phase = 'HUNTER_DONE';
            const target = state.players.find(p => p.id === targetId);
            // Đã chỉnh sửa để KHÔNG hiện vai trò của người bị bắn
            if (target && target.alive) killPlayerAndCheckLover(target.id, `🏹 Thợ Săn nổ súng bắn chết <b>${target.name}</b>!`);

            broadcastState();
            setTimeout(() => {
                if (!checkWinCondition()) {
                    if (state.prevPhase === 'RESOLVING_VOTE' || state.prevPhase === 'DAY_VOTE') { state.dayCount++; startNightPhase(); }
                    else { state.phase = 'DAY_DISCUSS'; broadcastState(); simulateAIChat(); setTimeout(startVotePhase, 2000); }
                }
            }, 2000);
        }

        function checkWinCondition() {
            const wolves = state.players.filter(p => p.alive && p.role.id === 'WOLF').length;
            const villagers = state.players.filter(p => p.alive && p.role.id !== 'WOLF').length;
            if (wolves === 0) {
                clearInterval(phaseInterval);
                state.phase = 'GAMEOVER'; broadcastLog(`🎉 <b>DÂN LÀNG THẮNG!</b> Đã diệt sạch Ma Sói.`, 'seer'); broadcastState(); return true;
            }
            if (wolves >= villagers) {
                clearInterval(phaseInterval);
                state.phase = 'GAMEOVER'; broadcastLog(`🐺 <b>MA SÓI THẮNG!</b> Số Sói đã áp đảo Dân Làng.`, 'death'); broadcastState(); return true;
            }
            return false;
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return; input.value = '';

            const me = state.players.find(p => p.id === myId);
            if (!me.alive && state.phase !== 'LOBBY' && state.phase !== 'GAMEOVER') {
                if (!isHost) addLogUI(`👻 Người chết không thể nói.`); return;
            }
            if (state.phase === 'NIGHT') {
                if (me.role && me.role.id === 'WOLF') {
                    if (isHost) {
                        state.players.filter(p => p.role && p.role.id === 'WOLF' && !p.isAI).forEach(w => sendLogToPlayer(w.id, `🐺 [Kênh Sói] <b>${me.name}:</b> ${escapeHtml(text)}`, 'wolf'));
                    } else db.ref('rooms/' + roomCode + '/chat').push({ text: `🐺 [Kênh Sói] <b>${me.name}:</b> ${escapeHtml(text)}`, logType: 'wolf', isNightWolfChat: true, senderId: myId });
                } else if (!isHost) addLogUI(`🌙 Ban đêm ngủ, không được nói chuyện!`);
                return;
            }
            if (isHost) broadcastLog(`💬 <b>${me.name}:</b> ${escapeHtml(text)}`);
            else db.ref('rooms/' + roomCode + '/chat').push({ text: `💬 <b>${me.name}:</b> ${escapeHtml(text)}` });
        }

        function escapeHtml(str) { return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

        function renderAll() {
            const me = state.players.find(p => p.id === myId);
            if (!me) return;

            if (lastRenderedPhase !== state.phase) {
                if (state.phase === 'NIGHT') playSFX('NIGHT');
                else if (state.phase === 'DAY_DISCUSS') playSFX('DAY');
                lastRenderedPhase = state.phase;
            }

            document.body.className = (state.phase === 'DAY_DISCUSS' || state.phase === 'DAY_VOTE' || state.phase === 'RESOLVING_VOTE') ? 'day-mode' : 'night-mode';
            document.getElementById('my-role-display').innerHTML = me.role ? `Vai trò: <b>${me.role.name}</b>` : `Người chơi: ${state.players.length}/${state.maxPlayers}`;

            const phaseNames = {
                'LOBBY': `⏳ SẢNH CHỜ (${state.players.length}/${state.maxPlayers})`, 'NIGHT': `🌙 ĐÊM THỨ ${state.dayCount}`,
                'DAY_DISCUSS': `☀️ NGÀY ${state.dayCount} - CÔNG BỐ`, 'DAY_VOTE': `🗳️ NGÀY ${state.dayCount} - BỎ PHIẾU`,
                'RESOLVING_VOTE': `⚖️ ĐANG TỔNG KẾT PHIẾU`, 'HUNTER_SHOT': `🏹 THỢ SĂN BẮN KÉO THEO`, 'GAMEOVER': `🏁 KẾT THÚC VÁN`
            };
            document.getElementById('phase-display').innerText = phaseNames[state.phase] || state.phase;
            
            const hostControls = document.getElementById('host-controls');
            if (isHost && state.phase === 'LOBBY') {
                hostControls.style.display = 'flex';
                document.getElementById('lobby-max-players-select').value = state.maxPlayers;
            } else {
                hostControls.style.display = 'none';
            }

            const timerBox = document.getElementById('phase-timer-box');
            const timerLabel = document.getElementById('timer-label');
            const timerText = document.getElementById('phase-timer');
            if (state.phase === 'NIGHT') {
                timerBox.style.display = 'block';
                timerLabel.innerText = 'Thời gian hành động đêm';
                timerText.innerText = state.phaseTimer !== undefined ? state.phaseTimer : 45;
            } else if (state.phase === 'DAY_VOTE') {
                timerBox.style.display = 'block';
                timerLabel.innerText = 'Thời gian bình chọn';
                timerText.innerText = state.phaseTimer !== undefined ? state.phaseTimer : 30;
            } else {
                timerBox.style.display = 'none';
            }

            const grid = document.getElementById('players-grid'); grid.innerHTML = '';
            
            state.players.forEach(p => {
                const isMe = p.id === myId;
                // Đã chỉnh sửa logic showRole để KHÔNG hiện vai trò của người khác khi họ chết. Chỉ hiện khi GAMEOVER, của chính mình, hoặc Sói thấy Sói.
                const showRole = (state.phase === 'GAMEOVER') || isMe || (me.role?.id === 'WOLF' && p.role?.id === 'WOLF');
                let statusText = 'Đang chờ...';
                if (state.phase !== 'LOBBY') {
                     statusText = p.alive 
                        ? (showRole && p.role ? p.role.name : '❓ Ẩn danh') 
                        : `Đã chết ${showRole && p.role ? '(' + p.role.name + ')' : '(❓ Ẩn danh)'}`;
                }

                const isSelected = selectedTargets.includes(p.id);
                const loverBadge = (state.lovers.includes(myId) && state.lovers.includes(p.id) && me.alive) ? `<div style="position:absolute; top:8px; left:8px; font-size:16px;">💘</div>` : "";
                
                const kickButtonHTML = (isHost && state.phase === 'LOBBY' && !isMe) 
                    ? `<div><button class="kick-btn" onclick="kickPlayer(event, '${p.id}')">👢 Kích</button></div>` 
                    : '';

                const card = document.createElement('div');
                card.className = `player-card ${p.alive ? '' : 'dead'} ${isMe ? 'is-me' : ''} ${isSelected ? 'selected' : ''}`;
                card.innerHTML = `
                    ${loverBadge} ${p.votes > 0 ? `<div class="vote-badge">${p.votes} phiếu</div>` : ''}
                    <div class="avatar">${p.alive ? p.avatar : '🪦'}</div>
                    <div class="p-name">${p.name} ${isMe ? '(Bạn)' : ''}</div>
                    <div class="p-status">${statusText}</div>
                    ${kickButtonHTML}
                `;

                if (p.alive && state.phase !== 'LOBBY' && state.phase !== 'GAMEOVER') {
                    card.onclick = () => {
                        if (state.phase === 'NIGHT' && state.dayCount === 1 && me.role?.id === 'CUPID') {
                            if (selectedTargets.includes(p.id)) selectedTargets = selectedTargets.filter(id => id !== p.id);
                            else if (selectedTargets.length < 2) selectedTargets.push(p.id);
                        } else selectedTargets = (selectedTargets[0] === p.id) ? [] : [p.id];
                        renderAll();
                    };
                }
                grid.appendChild(card);
            });
            
            const emptySeats = state.maxPlayers - state.players.length;
            for (let i = 0; i < emptySeats; i++) {
                const emptyCard = document.createElement('div');
                emptyCard.className = 'player-card empty-seat';
                emptyCard.innerHTML = `
                    <div class="avatar">🪑</div>
                    <div class="p-name">Ghế trống</div>
                    <div class="p-status">Đang chờ người vào...</div>
                `;
                grid.appendChild(emptyCard);
            }

            const promptEl = document.getElementById('action-prompt');
            const btnsEl = document.getElementById('action-buttons'); btnsEl.innerHTML = '';

            if (state.phase === 'LOBBY') {
                if (isHost) {
                    promptEl.innerText = `Đã có ${state.players.length}/${state.maxPlayers} người. Bắt đầu ngay hoặc thêm AI!`;
                    btnsEl.innerHTML = `<button class="btn btn-success" onclick="startGame()">🚀 Bắt Đầu Chơi</button>
                        ${state.players.length < state.maxPlayers ? `<button class="btn btn-primary" onclick="addAIPlayers()">🤖 Thêm AI</button>` : ''}`;
                } else promptEl.innerText = "Đang chờ Chủ phòng bắt đầu ván...";
            } else if (state.phase === 'NIGHT') {
                if (!me.alive) promptEl.innerText = "Bạn đã chết. Hãy chờ màn đêm kết thúc...";
                else if (me.nightActionDone) promptEl.innerText = "💤 Đã xong hành động. Đang chờ người khác...";
                else {
                    const labels = {
                        'WOLF': ['🐺 Chọn 1 người để cắn:', '🩸 Xác nhận cắn'], 'SEER': ['🔮 Chọn 1 người để soi:', '👁️ Soi người này'],
                        'GUARD': ['🛡️ Chọn 1 người để bảo vệ:', '🛡️ Xác nhận bảo vệ'], 'CUPID': ['👼 Chọn 2 người để ghép đôi (chỉ đêm 1):', '💘 Xác nhận ghép đôi']
                    };
                    promptEl.innerText = labels[me.role.id][0];
                    btnsEl.innerHTML = `<button class="btn btn-warn" onclick="submitNightAction()">${labels[me.role.id][1]}</button>`;
                }
            } else if (state.phase === 'DAY_DISCUSS') {
                promptEl.innerText = "☀️ Đang công bố kết quả đêm qua, chuẩn bị bỏ phiếu...";
            } else if (state.phase === 'DAY_VOTE') {
                if (!me.alive) promptEl.innerText = "Đang chờ người sống bỏ phiếu...";
                else if (me.voted) promptEl.innerText = "✅ Bạn đã bỏ phiếu. Đang chờ những người còn lại...";
                else {
                    promptEl.innerText = "🗳️ Thảo luận nhanh & chọn 1 người để treo cổ trong 30 giây:";
                    btnsEl.innerHTML = `<button class="btn" onclick="submitVote(false)">🗳️ Vote người đã chọn</button> <button class="btn btn-primary" onclick="submitVote(true)">⏭️ Bỏ phiếu trắng</button>`;
                }
            } else if (state.phase === 'HUNTER_SHOT') {
                if (myId === state.hunterId) {
                    promptEl.innerText = "🏹 Bạn vừa chết! Hãy chọn 1 người bắn kéo theo:";
                    btnsEl.innerHTML = `<button class="btn" onclick="submitHunterShot()">💥 Bắn mục tiêu</button>`;
                } else promptEl.innerText = "🏹 Thợ Săn đang nhắm bắn...";
            } else if (state.phase === 'GAMEOVER') {
                promptEl.innerText = "🏁 Ván chơi kết thúc!";
                if (isHost) btnsEl.innerHTML = `<button class="btn btn-success" onclick="returnToLobby()">🔙 Về Sảnh Chờ</button>`;
            }
        }
    </script>
</body>
</html>
